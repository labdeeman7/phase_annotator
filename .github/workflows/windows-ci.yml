name: Windows quality and release artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source on CPython 3.13
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up CPython 3.13.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format src tests scripts --check

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Type-check configured layers
        run: python -m mypy

      - name: Run tests with headless Qt
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Check patch whitespace
        run: git diff --check

  package-windows:
    name: Build and smoke-test Windows artifact
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up CPython 3.13.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[release]"

      - name: Build one-folder application
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 -PythonPath (Get-Command python).Source

      - name: Smoke-test frozen application
        shell: pwsh
        run: .\scripts\test_packaged_windows.ps1

      - name: Upload Windows application folder
        uses: actions/upload-artifact@v7
        with:
          name: PhaseAnnotator-windows-${{ github.sha }}
          path: dist/PhaseAnnotator/
          if-no-files-found: error
          retention-days: 14
