[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-annotator"
version = "0.1.0"
description = "A lightweight temporal phase annotation tool for surgical videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<2.4",
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.16,<0.17",
]
release = [
    "pyinstaller>=6.22,<6.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Start with correctness, import hygiene, and common bug-risk checks. Broader
# modernization and style families should be adopted deliberately, not en masse.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
files = [
    "src/phase_annotator/config",
    "src/phase_annotator/domain",
    "src/phase_annotator/media",
    "src/phase_annotator/storage",
]
check_untyped_defs = true
warn_unused_configs = true

[tool.setuptools.package-data]
"phase_annotator.config" = ["*.json"]
